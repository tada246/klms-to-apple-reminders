name: klms-to-apple-reminders
options:
  bundleIdPrefix: io.github.tada246
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: io.github.tada246.klms-to-apple-reminders
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  klms-to-apple-reminders:
    type: application
    platform: macOS
    sources:
      - path: klms-to-apple-reminders
    settings:
      base:
        INFOPLIST_FILE: klms-to-apple-reminders/Info.plist
        CODE_SIGN_ENTITLEMENTS: klms-to-apple-reminders/klms-to-apple-reminders.entitlements
    dependencies:
      - sdk: WebKit.framework

  klms-to-apple-remindersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: klms-to-apple-remindersTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tada246.klms-to-apple-remindersTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: klms-to-apple-reminders
